<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube Video Details</title>
    <!-- Tailwind CSS (keep consistent with index) -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #20232a;
            --card-bg-color: #282c34;
            --text-color: #ffffff;
            --accent-color: #61fbf8;
        }
        body { background-color: var(--bg-color); color: var(--text-color); }
        .accent { color: var(--accent-color); }
        .accent-bg { background-color: rgba(97,251,248,0.06); }
        /* Hover-only actions: hide copy/open buttons until parent is hovered */
        .hover-parent { position: relative; }
        .hover-actions { opacity: 0; transform: translateY(-6px); transition: opacity .18s ease, transform .18s ease; pointer-events: none; }
        .hover-parent:hover .hover-actions { opacity: 1; transform: translateY(0); pointer-events: auto; }
        /* Per-comment card subtle hover lift */
        .comment-card { transition: transform .12s ease, box-shadow .12s ease; }
        .comment-card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,0.35); }
        .hidden { display: none; }
        /* Corner home button */
        .corner-home {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 60;
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            background: linear-gradient(180deg, rgba(97,251,248,0.95), rgba(97,251,248,0.8));
            color: #000;
            box-shadow: 0 6px 18px rgba(0,0,0,0.35);
            transition: transform .12s ease, box-shadow .12s ease;
        }
        .corner-home:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(0,0,0,0.45); }
        .corner-home svg { width: 18px; height: 18px; }

        /* Description content enhancements */
        .description-content {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.6;
        }
        .description-content a:not(.timestamp-link) {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.125rem 0.375rem;
            margin: -0.125rem -0.375rem;
            border-radius: 0.25rem;
            transition: background-color .15s ease;
        }
        .description-content a:not(.timestamp-link):hover {
            background-color: rgba(59, 130, 246, 0.1);
        }
        .description-content .timestamps-section {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(148, 163, 184, 0.1);
            margin: 1rem 0;
            border-radius: 0.5rem;
        }
        .description-content .timestamps-section a {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
    </style>
</head>
<body class="min-h-screen flex items-start justify-center py-10">
    <div class="w-full max-w-5xl px-4">
        <!-- Corner Home Button -->
        <a href="/" class="corner-home" aria-label="Go back home" title="Home">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M3 11.5L12 4l9 7.5" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5 12v6a1 1 0 001 1h3v-4a1 1 0 011-1h4a1 1 0 011 1v4h3a1 1 0 001-1v-6" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>
        <div class="bg-white/5 rounded-lg p-6 shadow-lg accent-bg">
            <div class="flex flex-col md:flex-row gap-6">
                <!-- Thumbnail -->
                <div class="md:w-1/3 flex-shrink-0">
                    <img th:src="${vthumb}" alt="Video Thumbnail" class="w-full rounded-lg shadow-md object-cover">
                </div>

                <!-- Info -->
                <div class="md:w-2/3">
                        <div class="flex items-start justify-between gap-4 hover-parent">
                            <h1 class="text-2xl font-bold accent" th:text="${vtitle}">Video Title</h1>
                            <div class="hover-actions flex items-center gap-2">
                                <button class="text-sm px-3 py-1 bg-gray-700 rounded hover:bg-gray-600" onclick="copyText('title')">Copy Title</button>
                                <button class="text-sm px-3 py-1 bg-gray-700 rounded hover:bg-gray-600" onclick="copyText('thumbnail')">Copy Thumbnail URL</button>
                                <a th:href="${vthumb}" target="_blank" class="text-sm px-3 py-1 bg-gray-700 rounded hover:bg-gray-600">Open Thumbnail</a>
                            </div>
                        </div>

                    <div class="mt-3 flex flex-wrap gap-2 hover-parent">
                        <span th:each="tag : ${vtags}" th:text="${tag}" class="text-sm px-3 py-1 rounded-full bg-gray-700 text-gray-100">Tag</span>
                        <button class="hover-actions text-sm px-3 py-1 bg-gray-700 rounded hover:bg-gray-600" onclick="copyText('tags')">Copy Tags</button>
                    </div>

                    <div class="mt-4 hover-parent">
                        <h2 class="text-lg font-semibold accent">Description</h2>
                        <div class="description-content mt-2 text-sm text-gray-200" th:utext="${vdesc}"></div>
                        <div class="mt-3 flex gap-2">
                            <button class="hover-actions bg-accent text-black px-4 py-2 rounded-md hover:scale-105" onclick="copyText('description')">Copy Description</button>
                            <button class="hover-actions bg-gray-700 text-gray-100 px-4 py-2 rounded-md hover:bg-gray-600" onclick="copyAllComments()">Copy All Comments</button>
                            <a id="openOnYoutube" class="hover-actions ml-auto text-sm px-3 py-1 bg-gray-700 rounded hover:bg-gray-600" target="_blank">Open on YouTube</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Comments -->
            <div class="mt-6">
                <h2 class="text-lg font-semibold accent">Comments</h2>
                <div class="mt-4 space-y-4">
                    <div th:each="comment,iterStat : ${vcomments}" class="comment-card hover-parent flex gap-3 items-start p-3 rounded-lg bg-gray-800">
                        <div class="w-12 h-12 rounded-full bg-gray-600 flex-shrink-0" th:style="'background-image: url(' + ${comment.path('snippet').path('topLevelComment').path('snippet').path('authorProfileImageUrl')} + '); background-size: cover; background-position: center;'"></div>
                        <div class="flex-1">
                            <div class="flex items-center justify-between gap-4">
                                <div>
                                    <div class="font-semibold text-gray-100" th:text="${comment.path('snippet').path('topLevelComment').path('snippet').path('authorDisplayName')}">Author</div>
                                    <div class="text-xs text-gray-400" th:text="${comment.path('snippet').path('topLevelComment').path('snippet').path('publishedAt')}">Date</div>
                                </div>
                                <div class="flex items-center gap-2 hover-actions">
                                    <button class="text-sm text-gray-300 hover:text-white" onclick="copySingleComment(this)">Copy</button>
                                </div>
                            </div>
                            <div class="mt-1 text-sm text-gray-200 comment-text" th:utext="${comment.path('snippet').path('topLevelComment').path('snippet').path('textDisplay')}">Comment text</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-6 text-center">
                <a href="/" class="text-sm font-medium text-gray-200 hover:underline">Go back to Home</a>
            </div>
        </div>
    </div>

    <script>
        // Utility: sanitize strings to remove debug-like "Line 17:" or "Line 17" patterns
        function sanitizeString(s) {
            if (!s) return s;
            try {
                return s.replace(/Line\s*\d+\s*:/gi, '').replace(/\bLine\s*\d+\b/gi, '');
            } catch (e) {
                return s;
            }
        }

        // Decode HTML entities
        function decodeHTMLEntities(text) {
            let txt = document.createElement('textarea');
            txt.innerHTML = text;
            return txt.value;
        }

        // Extract videoId from a standard YouTube thumbnail URL like https://img.youtube.com/vi/<id>/hqdefault.jpg
        function getVideoIdFromThumb(url) {
            if (!url) return null;
            try {
                const m = url.match(/\/vi\/([^\/]+)\//);
                return m ? m[1] : null;
            } catch (e) { return null; }
        }

        // Convert timestamp string (hh:mm:ss or mm:ss) to seconds
        function timestampToSeconds(ts) {
            if (!ts) return 0;
            const parts = ts.split(':').map(p => parseInt(p, 10));
            if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
            if (parts.length === 2) return parts[0]*60 + parts[1];
            return parseInt(ts, 10) || 0;
        }

        // Replace timestamps in text with anchor elements linking to the video at that time
        function linkifyTimestamps(text, videoId) {
            if (!text) return text;
            // Match patterns like 1:23:45 or 12:34
            return text.replace(/\b(\d{1,2}:\d{2}(?::\d{2})?)\b/g, function(match, p1) {
                const seconds = timestampToSeconds(p1);
                if (!videoId) return match; // no video id available
                const href = `https://youtu.be/${videoId}?t=${seconds}`;
                return `<a class="text-accent underline timestamp-link" href="${href}" target="_blank">${p1}</a>`;
            });
        }

        // Enhanced content formatting for description and comments
        function autoLinkAndSanitize(raw, videoId) {
            if (!raw) return raw;
            let s = sanitizeString(raw);
            s = decodeHTMLEntities(s);

            // First linkify timestamps (so they become anchors)
            s = linkifyTimestamps(s, videoId);

            // Convert URLs into nice clickable links with proper styling
            s = s.replace(/(https?:\/\/[^\s"'<]+)/g, '<a class="text-blue-400 hover:text-blue-300 underline transition-colors" href="$1" target="_blank" rel="noopener">$1</a>');

            // Detect and format email addresses
            s = s.replace(/([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9._-]+)/gi, 
                '<span class="inline-flex items-center gap-1 px-1.5 py-0.5 bg-gray-700/50 rounded text-gray-200">' +
                '<svg class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor"><path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"></path><path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"></path></svg>' +
                '$1</span>');

            // Detect and format social media handles (@username)
            s = s.replace(/(@[\w]+)/g, '<span class="text-blue-400">$1</span>');

            // Handle lists (lines starting with - or •)
            s = s.split('\n').map(line => {
                if (line.trim().match(/^[-•]\s/)) {
                    return `<div class="flex gap-2 my-1"><span class="text-gray-500">•</span>${line.trim().substring(1)}</div>`;
                }
                return line;
            }).join('\n');

            // Add section collapsing for timestamp sections in descriptions
            if (s.includes('0:00') || s.includes('00:00')) {
                const lines = s.split('\n');
                let inTimestamps = false;
                const processed = lines.map((line, i) => {
                    if (line.match(/^(?:\d{1,2}:)?\d{1,2}:\d{2}/)) {
                        if (!inTimestamps) {
                            inTimestamps = true;
                            return `<div class="timestamps-section bg-gray-800/50 p-3 rounded mt-2 mb-1">
                                    <div class="flex items-center gap-2 mb-2">
                                        <svg class="w-4 h-4 text-accent" viewBox="0 0 20 20" fill="currentColor">
                                            <path d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z"/>
                                        </svg>
                                        <span class="text-sm font-medium text-accent">Timestamps</span>
                                    </div>${line}`;
                        }
                        return line;
                    } else if (inTimestamps && line.trim() === '') {
                        inTimestamps = false;
                        return '</div>' + line;
                    } else if (inTimestamps) {
                        return line;
                    }
                    return line;
                });
                s = processed.join('\n');
                if (inTimestamps) s += '</div>'; // Close timestamps section if it's at the end
            }

            return s;
        }

        // Toggle read more / less for long comments
        // Limit comments to a number of words (default 20) and provide a toggle
        function makeReadMoreFor(el, maxWords = 20) {
            const rawHtml = el.innerHTML || '';
            const textOnly = (el.innerText || '').trim();
            if (!textOnly) return;
            const words = textOnly.split(/\s+/);
            if (words.length <= maxWords) return; // nothing to do
            const short = words.slice(0, maxWords).join(' ');
            const moreId = 'more-' + Math.random().toString(36).slice(2,9);
            // Keep the processed HTML for the full content, use plain-text short preview
            el.innerHTML = `<span class="short-text">${escapeHtml(short)}...</span> <button class="text-xs text-accent ml-2" data-more-id="${moreId}">Read more</button><span id="${moreId}" class="full-text hidden">${rawHtml}</span>`;
            const btn = el.querySelector('button[data-more-id]');
            if (btn) {
                btn.addEventListener('click', () => {
                    const target = document.getElementById(btn.getAttribute('data-more-id'));
                    const shortEl = el.querySelector('.short-text');
                    if (!target || !shortEl) return;
                    if (target.classList.contains('hidden')) {
                        target.classList.remove('hidden');
                        btn.textContent = 'Show less';
                        shortEl.style.display = 'none';
                    } else {
                        target.classList.add('hidden');
                        btn.textContent = 'Read more';
                        shortEl.style.display = '';
                    }
                });
            }
        }

        // Small helper to escape text for safe insertion into HTML short preview
        function escapeHtml(unsafe) {
            return unsafe.replace(/[&<>"']/g, function(m) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#039;"})[m]; });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const thumbEl = document.querySelector('img[th\:src]') || document.querySelector('img');
            const thumbUrl = thumbEl ? thumbEl.getAttribute('src') || thumbEl.getAttribute('th:src') : null;
            const videoId = getVideoIdFromThumb(thumbUrl);

            // Set the Open on YouTube link if possible
            const openLink = document.getElementById('openOnYoutube');
            if (openLink) {
                if (videoId) openLink.href = `https://youtu.be/${videoId}`;
                else openLink.href = '#';
            }

            // Process description
            const desc = document.querySelector('.description-content');
            if (desc) {
                let raw = desc.innerHTML || '';
                const processed = autoLinkAndSanitize(raw, videoId);
                desc.innerHTML = processed;
            }

            // Process comments
            document.querySelectorAll('.comment-text').forEach(el => {
                let raw = el.innerHTML || '';
                let processed = autoLinkAndSanitize(raw, videoId);
                el.innerHTML = processed;
                // Add read more for long comments (limit to 20 words)
                makeReadMoreFor(el, 20);
            });
        });

        // Copy utilities
        function copyText(identifier) {
            try {
                let text = '';
                if (identifier === 'description') {
                    const desc = document.querySelector('.description-content');
                    text = desc ? desc.innerText.trim() : '';
                } else if (identifier === 'title') {
                    const titleEl = document.querySelector('h1[th\:text]') || document.querySelector('h1');
                    text = titleEl ? titleEl.innerText.trim() : '';
                } else if (identifier === 'thumbnail') {
                    const thumb = document.querySelector('img[th\:src]') || document.querySelector('img');
                    text = thumb ? (thumb.getAttribute('src') || '') : '';
                } else if (identifier === 'tags') {
                    text = Array.from(document.querySelectorAll('.mt-3 span')).map(s => s.innerText).filter(Boolean).join(', ');
                }
                if (!text) return alert('Nothing to copy');
                navigator.clipboard.writeText(text).then(() => alert('Copied to clipboard'));
            } catch (e) {
                console.error(e);
                alert('Copy failed');
            }
        }

        function copySingleComment(btn) {
            const card = btn.closest('.flex');
            if (!card) return;
            const commentEl = card.querySelector('.comment-text');
            const text = commentEl ? commentEl.innerText.trim() : '';
            if (!text) return alert('Nothing to copy');
            navigator.clipboard.writeText(text).then(() => alert('Copied comment'));
        }

        function copyAllComments() {
            const comments = Array.from(document.querySelectorAll('.comment-text')).map(c => c.innerText.trim()).filter(Boolean);
            if (comments.length === 0) return alert('No comments to copy');
            const joined = comments.join('\n\n');
            navigator.clipboard.writeText(joined).then(() => alert('Copied all comments'));
        }
    </script>
</body>
</html>
